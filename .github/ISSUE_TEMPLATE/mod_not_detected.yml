name: Mod non détecté
description: Signaler un mod Stardew Valley que StarHubFR ne détecte pas ou détecte incorrectement
title: "[Mod non détecté] "
labels: ["bug", "detection"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de signaler ce problème de détection. Merci de remplir les champs ci-dessous le plus précisément possible.
  - type: input
    id: mod-name
    attributes:
      label: Nom du mod
      description: Le nom exact du mod concerné
      placeholder: "Ex: Stardew Valley Expanded"
    validations:
      required: true
  - type: input
    id: nexus-link
    attributes:
      label: Lien Nexus Mods
      description: URL de la fiche Nexus du mod
      placeholder: "https://www.nexusmods.com/stardewvalley/mods/..."
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Comportement attendu
      description: Que devrait détecter ou afficher StarHubFR ?
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Comportement observé
      description: Que se passe-t-il réellement (mod absent, mauvaise version, mauvais nom, etc.) ?
    validations:
      required: true
  - type: input
    id: starhubfr-version
    attributes:
      label: Version de StarHubFR
      placeholder: "Ex: v1.28.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Système d'exploitation
      options:
        - macOS
        - Windows
        - Linux
        - Autre
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Contexte additionnel
      description: Captures d'écran, logs, ou toute autre information utile
