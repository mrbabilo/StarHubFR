name: Mod non détecté · Mod not detected
description: Un mod présent dans Mods/ n'apparaît pas dans StarHubFR, ou avec un mauvais nom, une mauvaise version ou une mauvaise mise à jour.
labels: ["bug", "detection"]
body:
  - type: markdown
    attributes:
      value: |
        StarHubFR reconnaît un mod à son `manifest.json`. Le contenu de ce fichier règle la plupart des cas.
        Un mod en pause est un dossier dont le nom commence par un point (`.X`) : il est normal qu'il soit grisé.
  - type: input
    id: mod-name
    attributes:
      label: Nom du mod · Mod name
      placeholder: "Stardew Valley Expanded"
    validations:
      required: true
  - type: input
    id: nexus-link
    attributes:
      label: Lien Nexus Mods (si le mod y est)
      placeholder: "https://www.nexusmods.com/stardewvalley/mods/…"
  - type: input
    id: folder
    attributes:
      label: Nom du dossier dans Mods/ · Folder name
      description: Avec ses dossiers parents s'il est dans un sous-dossier.
      placeholder: "Mods/[SVE]/Stardew Valley Expanded"
  - type: textarea
    id: actual-behavior
    attributes:
      label: Ce que StarHubFR affiche · What StarHubFR shows
      description: Mod absent, nom ou version faux, mise à jour proposée à tort, autre.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Ce que vous attendiez · What you expected
    validations:
      required: true
  - type: textarea
    id: manifest
    attributes:
      label: Contenu du manifest.json
      description: Ouvrez le fichier `manifest.json` du mod dans un éditeur de texte et collez son contenu.
      render: json
  - type: input
    id: starhubfr-version
    attributes:
      label: Version de StarHubFR
      description: En bas des Réglages, ou menu StarHubFR › À propos.
      placeholder: "v1.66.0"
    validations:
      required: true
