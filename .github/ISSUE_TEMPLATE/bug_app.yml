name: Bug de l'app · App bug
description: Quelque chose ne marche pas dans StarHubFR (écran, bouton, plantage, donnée fausse).
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler ce bug. Un rapport précis se corrige vite.
        *Thanks for reporting. English is welcome too.*
  - type: textarea
    id: description
    attributes:
      label: Ce qui se passe · What happens
      description: Ce que vous avez vu, et sur quel écran.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire · Steps to reproduce
      placeholder: |
        1. Ouvrir l'onglet …
        2. Cliquer sur …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ce que vous attendiez · What you expected
    validations:
      required: true
  - type: input
    id: starhubfr-version
    attributes:
      label: Version de StarHubFR
      description: En bas des Réglages, ou menu StarHubFR › À propos.
      placeholder: "v1.66.0"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: Version de macOS
      placeholder: "macOS 15.5"
    validations:
      required: true
  - type: dropdown
    id: mac
    attributes:
      label: Processeur du Mac · Mac chip
      options:
        - Apple Silicon (M1, M2, M3, M4…)
        - Intel
        - Je ne sais pas · Not sure
  - type: textarea
    id: logs
    attributes:
      label: Journaux · Logs
      description: |
        Onglet Journaux › « Copier tous les journaux visibles », puis collez ici.
        Si le jeu est en cause, ajoutez le lien du journal SMAPI déposé sur https://smapi.io/log
        (fichier `~/.config/StardewValley/ErrorLogs/SMAPI-latest.txt`).
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Captures d'écran · Screenshots
      description: Glissez une image ici si l'écran aide à comprendre.
