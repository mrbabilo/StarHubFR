name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Show Swift version
        run: swift --version

      - name: Run test suite
        run: |
          chmod +x run_tests.sh
          ./run_tests.sh

      - name: Check coding standards
        run: python3 check_standards.py
